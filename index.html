<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adaptive Planner</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Adaptive Planner</h1>
        <p>按权重、精力、日历固定行程自动重排当天计划</p>
      </div>
      <div class="auth-panel">
        <input id="clientIdInput" type="text" aria-label="Google OAuth Client ID" />
        <button id="saveClientIdButton" type="button">保存 Client ID</button>
        <button id="connectButton" type="button">连接 Google Calendar</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>日期与可用时间</h2>
        <label>计划日期 <input id="planDateInput" type="date" /></label>
        <div class="row">
          <button id="loadCalendarButton" type="button">读取日历</button>
          <button id="addDefaultBlocksButton" type="button">生成默认时间块</button>
          <button id="rescheduleButton" type="button">调度</button>
        </div>
        <div id="availableBlocks"></div>
        <button id="addBlockButton" type="button">添加可用时间块</button>
      </section>

      <section class="panel">
        <h2>添加任务</h2>
        <form id="taskForm" class="form-grid">
          <label class="field">
            <span>任务名</span>
            <input name="taskName" required />
          </label>
          <label class="field">
            <span>任务类型</span>
            <select name="taskType"></select>
          </label>
          <label class="field">
            <span>想要时长</span>
            <input name="desiredMinutes" required type="number" min="1" />
          </label>
          <label class="field">
            <span>最小时长</span>
            <input name="minimumMinutes" required type="number" min="1" />
          </label>
          <label class="field">
            <span>重要性</span>
            <input name="importance" required type="number" min="1" max="5" value="3" />
          </label>
          <label class="field">
            <span>截止时间</span>
            <input name="deadline" type="datetime-local" />
          </label>
          <label class="field">
            <span>执行场景</span>
            <select name="executionContext"></select>
          </label>
          <label class="checkbox"><input name="fixed" type="checkbox" /> 固定时间</label>
          <label class="field">
            <span>固定开始时间</span>
            <input name="fixedStart" type="time" />
          </label>
          <label class="field">
            <span>固定结束时间</span>
            <input name="fixedEnd" type="time" />
          </label>
          <button id="taskSubmitButton" type="submit">添加任务</button>
          <button id="cancelEditTaskButton" class="hidden" type="button">取消编辑</button>
        </form>
      </section>

      <section class="panel wide">
        <h2>当天计划</h2>
        <div id="conflictPanel" class="hidden"></div>
        <div id="scheduleList"></div>
        <h3>同步预览</h3>
        <div id="syncPreview"></div>
        <button id="syncButton" type="button">写入 Google Calendar</button>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
